# Secret detection patterns knowledge pack
# Used by agents to recognise hardcoded secrets and credentials.

patterns:
  - name: aws-access-key
    regex: "(AKIA|ASIA)[0-9A-Z]{16}"
    severity: high
    description: AWS access key ID

  - name: aws-secret-key
    regex: "aws.{0,20}secret.{0,20}['\"]([0-9a-zA-Z/+]{40})['\"]"
    severity: high
    description: AWS secret access key

  - name: github-token
    regex: "gh[pousr]_[A-Za-z0-9]{36,}"
    severity: high
    description: GitHub personal access token or app token

  - name: generic-api-key
    regex: "(api[_-]?key|apikey|api[_-]?token)\\s*[:=]\\s*['\"]([^'\"\\s]{16,})['\"]"
    severity: medium
    description: Generic API key assignment

  - name: private-key
    regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    severity: critical
    description: Private key material in source code

  - name: jwt-token
    regex: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"
    severity: medium
    description: Hardcoded JWT (may be expired but leaks algorithm/claims)

  - name: slack-webhook
    regex: "hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+"
    severity: high
    description: Slack incoming webhook URL

  - name: basic-auth-url
    regex: "https?://[^:]+:[^@]+@"
    severity: high
    description: Credentials embedded in URL

false_positive_indicators:
  - "EXAMPLE_KEY"
  - "YOUR_API_KEY"
  - "placeholder"
  - "test_"
  - "fake_"
  - "dummy_"
  - "example.com"
  - ".env.example"
