models:
  providers:
    - name: anthropic
      type: anthropic
      api_key_env: ANTHROPIC_API_KEY
    - name: openai
      type: openai
      api_key_env: OPENAI_API_KEY
    - name: local
      type: openai_compatible
      base_url: http://localhost:11434/v1
      api_key_env: ""
  roles:
    triage:    { provider: local,     model: "qwen2.5-coder:14b" }
    reasoning: { provider: anthropic, model: "claude-opus-4-8" }
    report:    { provider: anthropic, model: "claude-sonnet-4-6" }

scope:
  include: ["**/*.go", "**/*.py", "**/*.js", "**/*.ts", "**/*.env*", "**/*.yaml", "**/*.yml"]
  exclude: ["**/node_modules/**", "**/vendor/**", "**/.git/**"]
  follow_dependencies: true

tools:
  secrets:      { enabled: true,  external: ["gitleaks"] }
  dependencies: { enabled: true,  external: ["osv-scanner"] }
  sast:         { enabled: false, external: ["semgrep"] }

guardrails:
  max_files: 5000
  max_runtime_minutes: 30
  max_cost_usd: 10
  egress_allowlist: ["github.com", "raw.githubusercontent.com"]
  require_human_approval_for: []

output:
  report_path: ./report.html
  artifacts_dir: ./.codeaudit/runs

# Autonomous pentest via CAI (https://github.com/aliasrobotics/cai)
# Activate with: codeaudit --pentest [--pentest-target <url|host>]
# Requires: pip install cai-framework
#
# Model config is inherited from the providers/roles above — API keys flow
# automatically from this config into CAI's environment.
pentest:
  port: 18765                       # CAI HTTP API server port (localhost only)
  api_key_env: ""                   # CAI auth key (falls back to ALIAS_API_KEY env)
  static_agents:                    # Agents for code-level analysis (always run with --pentest)
    - "Code Agent"
  dynamic_agents:                   # Agents for active target testing (need --pentest-target)
    - "Red Team Agent"
    - "Web Pentester"
  timeout_minutes: 20               # Max wall-clock for the entire pentest phase
